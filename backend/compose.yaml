# Local development only: run docker compose up -d.
name: challenge

services:
  web:
    build: .
    command: >-
      sh -c 'python manage.py check &&
      exec gunicorn config.wsgi:application
      --bind 0.0.0.0:8000 --reload
      --access-logfile - --error-logfile -'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    env_file: .env
    environment:
      DJANGO_DEBUG: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: disable
      DJANGO_CACHE_URL: redis://redis:6379/0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready/', timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in backend/.env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-5439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: challenge-postgres-data
