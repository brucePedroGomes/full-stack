# Local development only: run docker compose up -d.
name: challenge

services:
  web:
    build: .
    command:
      - sh
      - -c
      - >-
        python manage.py check &&
        exec gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --reload
        --access-logfile -
        --error-logfile -
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: django-insecure-local-development-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      DB_NAME: challenge
      DB_USER: challenge
      DB_PASSWORD: local-dev-password
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: disable
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready/', timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: challenge
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: challenge-postgres-data
