[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django[argon2]>=6.1.1",
    "psycopg[c]>=3.3.6",
    "gunicorn>=23.0.0",
    "djangorestframework>=3.18.1,<3.19",
    "djangorestframework-simplejwt>=5.5.1,<6",
    "django-filter>=26.1,<27",
    "drf-spectacular[sidecar]>=0.30,<0.31",
    "whitenoise>=6.12,<7",
    "redis>=6,<7",
    "celery[redis]>=5.6,<6",
    "pydantic>=2.12,<3",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-django>=0.65b0",
    "opentelemetry-instrumentation-psycopg>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-celery>=0.65b0",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-system-metrics>=0.65b0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26",
    "coverage[toml]>=7.10,<8",
    "djangorestframework-stubs>=3.18.1",
    "pyright>=1.1.414",
]

[tool.coverage.run]
source = ["config", "tasks", "users"]
branch = true
relative_files = true
patch = ["subprocess"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2
