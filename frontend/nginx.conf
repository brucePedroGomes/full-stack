server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker DNS. The variable below makes nginx look up "web" again when it
    # restarts with a new IP, instead of keeping the IP from startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://web:8000;

    # Django routes. Keep the original Host (with port) so CSRF origin checks pass.
    location ~ ^/(api|admin|static)/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
    }

    # Vite adds a content hash to these file names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "same-origin";
    }

    # Single-page app: unknown paths load index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "same-origin";
    }
}
